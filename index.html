<!DOCTYPE html>
<html>
<head>
  <title>Kalkulator Pintarku</title>
  <style>
    body { font-family: Arial; display: flex; justify-content: center; padding-top: 50px; background-color: #a3c4f3; }
    .kalkulator { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
    input { width: 100%; height: 50px; margin-bottom: 10px; font-size: 24px; text-align: right; box-sizing: border-box; }
    .tombol { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    button { height: 50px; font-size: 20px; border-radius: 8px; border: none; background: #e0e0e0; cursor: pointer; }
    button:active { background: #cccccc; }
    .warna-oren { background: #fca311; color: white; }
  </style>
</head>
<body>

  <div class="kalkulator">
    <input type="text" id="layar" disabled>
    <div class="tombol">
      <button onclick="pencet('7')">7</button>
      <button onclick="pencet('8')">8</button>
      <button onclick="pencet('9')">9</button>
      <button class="warna-oren" onclick="pencet('+')">+</button>
      
      <button onclick="pencet('4')">4</button>
      <button onclick="pencet('5')">5</button>
      <button onclick="pencet('6')">6</button>
      <button class="warna-oren" onclick="pencet('-')">-</button>
      
      <button onclick="pencet('1')">1</button>
      <button onclick="pencet('2')">2</button>
      <button onclick="pencet('3')">3</button>
      <button class="warna-oren" onclick="pencet('*')">x</button>
      
      <button onclick="hapusSemua()">C</button>
      <button onclick="pencet('0')">0</button>
      <button class="warna-oren" onclick="hitungSelesai()">=</button>
      <button class="warna-oren" onclick="pencet('/')">:</button>
    </div>
  </div>

  <script>
    let layarKalkulator = document.getElementById('layar');
    
    function pencet(angkaAtauSimbol) {
      layarKalkulator.value = layarKalkulator.value + angkaAtauSimbol;
    }
    
    function hapusSemua() {
      layarKalkulator.value = '';
    }
    
    function hitungSelesai() {
      layarKalkulator.value = eval(layarKalkulator.value);
    }
  </script>

</body>
</html>
